<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tommin kauppalista</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js"defer></script>
</head>
<body>

    <div class="container">
        <h1>Tommin kauppalista</h1>
        <p>Mitä pitää ostaa kaupasta?</p>

        <form id="shopping-form">
            <label for="product">Tuotteen nimi</label>
            <input type="text" id="product" placeholder="Kirjoita tähän...">
            <button type="submit">Lisää</button>
            <p id="error-message"></p>
        </form>

        <h2>Ostoslista</h2>
        <ul id="shopping-list"></ul>
    </div>
    
</body>
</html>
